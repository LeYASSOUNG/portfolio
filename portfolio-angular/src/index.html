  <body>
    <!-- Theme init: apply saved theme before Angular renders to avoid flash -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
