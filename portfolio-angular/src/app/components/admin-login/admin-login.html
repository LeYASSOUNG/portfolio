<div class="login-page">
  <div class="login-card">

    <!-- En-tête -->
    <div class="login-header">
      <div class="login-icon">
        <i class="fas fa-user-shield" aria-hidden="true"></i>
      </div>
      <h1 class="login-title">Administration</h1>
      <p class="login-subtitle">Connectez-vous à votre espace sécurisé</p>
    </div>

    <!-- Erreur -->
    <div *ngIf="errorMessage()" class="login-error" role="alert">
      <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
      {{ errorMessage() }}
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="login-field">
        <label for="admin-email">Adresse email</label>
        <div class="login-input-wrapper">
          <i class="fas fa-envelope login-input-icon" aria-hidden="true"></i>
          <input
            id="admin-email"
            type="email"
            formControlName="email"
            placeholder="admin@portfolio.com"
            title="Adresse email administrateur"
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="login-field">
        <label for="admin-password">Mot de passe</label>
        <div class="login-input-wrapper">
          <i class="fas fa-lock login-input-icon" aria-hidden="true"></i>
          <input
            id="admin-password"
            type="password"
            formControlName="password"
            placeholder="••••••••••"
            title="Mot de passe administrateur"
            autocomplete="current-password"
            required
          >
        </div>
      </div>

      <button
        type="submit"
        class="login-submit"
        [disabled]="isLoading() || loginForm.invalid"
      >
        @if (isLoading()) {
          <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
          Connexion en cours...
        } @else {
          <i class="fas fa-arrow-right" aria-hidden="true"></i>
          Se connecter
        }
      </button>
    </form>

    <div class="login-footer">
      Accès réservé aux administrateurs du portfolio
    </div>
  </div>
</div>
